[workspace]
resolver = "2"
members = ["og-server"]

[workspace.dependencies]
axum = "0.8"
lambda_http = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-config = "1"
aws-sdk-s3 = "1"
